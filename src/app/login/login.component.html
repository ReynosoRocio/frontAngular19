<div class="custom-container" [class.custom-right-panel-active]="isRightPanelActive">
    <div class="custom-form-container custom-sign-up-container">
      <form action="#">
        <h1>Crear cuenta</h1>



        <input type="email" name="email"  [(ngModel)]="user.email" placeholder="Correo electrónico" />
        <input type="password" placeholder="Contraseña"  name="password" [(ngModel)]="user.password" />
        <input type="password" placeholder="Repite la contraseña" name="password1"  [(ngModel)]="user.password1" />
        <input type="text" placeholder="Nombre" name="name"  [(ngModel)]="user.name" />
        <input type="date" placeholder="Fecha de nacimiento" name="birthDate" [(ngModel)]="user.birthDate" />        
        <ng-select
        [items]="states"
        bindLabel="name"
        bindValue="id"
        name="selectedState"
        [(ngModel)]="user.selectedState"
        placeholder="Selecciona tu estado">
      </ng-select>


        <button>Registrarse</button>
        <!-- Botón extra para cambiar al formulario de inicio de sesión en pantallas pequeñas -->
        <button class="custom-toggle" (click)="onSignInClick()">Ya tengo una cuenta</button>
      </form>
    </div>
    <div class="custom-form-container custom-sign-in-container" >
      <form action="#">
        <h1>Iniciar sesión</h1>
        <input type="email" name="emailL"  [(ngModel)]="user.email" placeholder="Correo electrónico" />
        <input type="password" name="passwordL"  [(ngModel)]="user.password" placeholder="Contraseña" />
        <button>Entrar</button>
        <!-- Botón extra para cambiar al formulario de registro en pantallas pequeñas -->
        <button class="custom-toggle" (click)="onSignUpClick()">Crear una cuenta</button>
      </form>
    </div>
    <!-- Panel de superposición, oculto en tabletas y móviles -->
    <div class="custom-overlay-container">
      <div class="custom-overlay">
        <div class="custom-overlay-panel custom-overlay-left">
          <h1>¡Hola, de nuevo!</h1>
          <p>Si ya tienes una cuenta, ingresa.</p>
          <button class="custom-ghost" (click)="onSignInClick()">Iniciar sesión</button>
        </div>
        <div class="custom-overlay-panel custom-overlay-right">
          <h1>¡Hola, amig&#64;!</h1>
          <p>Agrega algunos datos, y crea una nueva cuenta.</p>
          <button class="custom-ghost" (click)="onSignUpClick()">Crear una nueva cuenta</button>
        </div>
      </div>
    </div>
  </div>
