<button (click)="openModal()">Editar Usuario</button>

<div class="modal" *ngIf="isModalOpen">
  <div class="modal-content">
    <h2>{{ mode === 1 ? 'Editar Mis Datos' : 'Editar Usuario' }}</h2>
    <form (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="p-field">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" [(ngModel)]="user.email" name="email" required />
      </div>

      <!-- Name -->
      <div class="p-field">
        <label for="name">Nombre</label>
        <input type="text" id="name" [(ngModel)]="user.name" name="name" required />
      </div>

      <!-- Lastname -->
      <div class="p-field">
        <label for="lastname">Apellido</label>
        <input type="text" id="lastname" [(ngModel)]="user.lastname" name="lastname" required />
      </div>

      <!-- Password -->
      <div class="p-field">
        <label for="password">Nueva Contraseña</label>
        <input type="password" id="password" [(ngModel)]="user.password" name="password" required />
      </div>

      <!-- Confirm Password -->
      <div class="p-field">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" [(ngModel)]="user.confirmPassword" name="confirmPassword" required />
      </div>

      <!-- Old Password (only for mode 1) -->
      <div class="p-field" *ngIf="mode === 1">
        <label for="oldPassword">Contraseña Anterior</label>
        <input type="password" id="oldPassword" [(ngModel)]="user.oldPassword" name="oldPassword" required />
      </div>

      <button type="submit">Guardar Cambios</button>
      <button type="button" (click)="closeModal()">Cancelar</button>
    </form>
  </div>
</div>
